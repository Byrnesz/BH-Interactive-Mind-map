    left: 50%;

    overflow: hidden;
    cursor: grab;
  }

  svg#mindmap {
    width: 100%;
    height: 100%;
    display: block;
  }

  .node-group { cursor: pointer; }

    filter: drop-shadow(0 2px 8px rgba(0,0,0,0.5));

// ─── LAYOUT ──────────────────────────────────────────────────────────────────
const svg = document.getElementById('mindmap');
const wrap = document.getElementById('canvas-wrap');
const tooltip = document.getElementById('tooltip');

let transform = { x: 0, y: 0, scale: 1 };
let isDragging = false;
let dragStart = { x: 0, y: 0 };
let collapsed = new Set();

const W = () => wrap.clientWidth;
const H = () => wrap.clientHeight;

// Color palette cycling
const COLORS = ["#c9a96e","#7ec8a0","#7ab3d4","#d47ab3","#d4a47a","#a47ad4","#7ad4c8","#d47a7a","#9dc96e","#c96e9d"];

function getNodeColor(node, depth) {
  if (node.color) return node.color;
  if (depth === 0) return "#c9a96e";
  return "#8a8fa8";
}

// Calculate layout positions using radial tree
function calcLayout() {
  const nodes = [];
  const links = [];

  const ROOT_R = 60;
  const L1_R = 38;
  const L2_R = 28;
  const L3_R = 20;
  const L4_R = 14;

  const cx = W() / 2;
  const cy = H() / 2;

  // Root
  const root = { ...data, x: cx, y: cy, depth: 0, r: ROOT_R };
  nodes.push(root);

  function addChildren(parent, depth) {
    if (collapsed.has(parent.id)) return;
    const children = parent.children;
    if (!children || children.length === 0) return;

    const count = children.length;
    // Spread angle around parent
    let startAngle, sweepAngle;

    if (depth === 0) {
      startAngle = -Math.PI / 2;
      sweepAngle = 2 * Math.PI;
    } else {
      // use parent's angle spread, center it
      startAngle = (parent.angleStart || 0);
      sweepAngle = (parent.angleSweep || 2 * Math.PI);
    }

    const distances = [0, 240, 180, 150, 120];
    const dist = distances[Math.min(depth, distances.length - 1)];
    const radii = [ROOT_R, L1_R, L2_R, L3_R, L4_R];
    const r = radii[Math.min(depth + 1, radii.length - 1)];

    children.forEach((child, i) => {
      const angle = startAngle + (sweepAngle / count) * (i + 0.5);
      const x = parent.x + Math.cos(angle) * dist;
      const y = parent.y + Math.sin(angle) * dist;

      const node = {
        ...child,
        x, y, depth: depth + 1, r,
        angle,
        angleStart: angle - (sweepAngle / count) * 0.5,
        angleSweep: sweepAngle / count,
        parentId: parent.id,
        color: child.color || getInheritedColor(child, parent)
      };
      nodes.push(node);
      links.push({ source: parent, target: node });
      addChildren(node, depth + 1);
    });
  }

  function getInheritedColor(child, parent) {
    return parent.color || "#8a8fa8";
  }

  addChildren(root, 0);
  return { nodes, links };
}

// ─── RENDER ──────────────────────────────────────────────────────────────────
function render() {
  svg.innerHTML = '';

  const { nodes, links } = calcLayout();

  const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
  g.setAttribute("id", "scene");
  svg.appendChild(g);

  applyTransform();

  // Links
  const linkGroup = document.createElementNS("http://www.w3.org/2000/svg", "g");
  linkGroup.setAttribute("id", "links");
  g.appendChild(linkGroup);

  links.forEach(link => {
    const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
    const sx = link.source.x, sy = link.source.y;
    const tx = link.target.x, ty = link.target.y;
    const mx = (sx + tx) / 2;
    const my = (sy + ty) / 2;
    path.setAttribute("d", `M${sx},${sy} Q${mx},${sy} ${tx},${ty}`);
    path.setAttribute("class", "link");
    path.setAttribute("stroke", link.target.color || "#8a8fa8");
    linkGroup.appendChild(path);
  });

  // Nodes
  const nodeGroup = document.createElementNS("http://www.w3.org/2000/svg", "g");
  nodeGroup.setAttribute("id", "nodes");
  g.appendChild(nodeGroup);

  nodes.forEach(node => {
    const ng = document.createElementNS("http://www.w3.org/2000/svg", "g");
    ng.setAttribute("class", "node-group");
    ng.setAttribute("data-id", node.id);
    ng.setAttribute("transform", `translate(${node.x},${node.y})`);

    const hasChildren = node.children && node.children.length > 0;
    const isCollapsed = collapsed.has(node.id);

    // Outer glow circle
    if (node.depth <= 1) {
      const glow = document.createElementNS("http://www.w3.org/2000/svg", "circle");
      glow.setAttribute("r", node.r + 8);
      glow.setAttribute("fill", node.color || "#8a8fa8");
      glow.setAttribute("opacity", "0.12");
      ng.appendChild(glow);
    }

    // Main circle
    const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
    circle.setAttribute("r", node.r);
    circle.setAttribute("class", "node-circle");

    if (node.depth === 0) {
      circle.setAttribute("fill", "#1e2236");
      circle.setAttribute("stroke", "#c9a96e");
      circle.setAttribute("stroke-width", "2.5");
    } else {
      circle.setAttribute("fill", hexToRgba(node.color || "#8a8fa8", isCollapsed ? 0.85 : 0.18));
      circle.setAttribute("stroke", node.color || "#8a8fa8");
      circle.setAttribute("stroke-width", node.depth <= 2 ? "2" : "1.5");
    }
    ng.appendChild(circle);

    // Label
    const lines = node.label.split('\n');
    const fontSize = node.depth === 0 ? 12 : node.depth === 1 ? 11 : node.depth === 2 ? 10 : 9;
    const lineH = fontSize * 1.3;
    const totalH = lines.length * lineH;

    lines.forEach((line, i) => {
      const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
      text.setAttribute("class", "node-label");
      text.setAttribute("text-anchor", "middle");
      text.setAttribute("y", -totalH / 2 + lineH * (i + 0.5));
      text.setAttribute("font-size", fontSize);
      text.setAttribute("font-weight", node.depth <= 1 ? "600" : "400");

      if (node.depth === 0) {
        text.setAttribute("fill", "#c9a96e");
        text.setAttribute("font-family", "'Playfair Display', serif");
        text.setAttribute("font-size", "13");
      } else if (node.depth === 1) {
        text.setAttribute("fill", node.color || "#e8e6df");
      } else {
        text.setAttribute("fill", "#c8cad8");
      }

      text.textContent = line;
      ng.appendChild(text);
    });

    // Collapse indicator
    if (hasChildren && isCollapsed) {
      const badge = document.createElementNS("http://www.w3.org/2000/svg", "circle");
      badge.setAttribute("r", "7");
      badge.setAttribute("cx", node.r - 4);
      badge.setAttribute("cy", -(node.r - 4));
      badge.setAttribute("fill", node.color || "#8a8fa8");
      ng.appendChild(badge);

      const btext = document.createElementNS("http://www.w3.org/2000/svg", "text");
      btext.setAttribute("class", "collapsed-indicator");
      btext.setAttribute("x", node.r - 4);
      btext.setAttribute("y", -(node.r - 4));
      btext.textContent = node.children.length;
      ng.appendChild(btext);
    }

    if (hasChildren) {
      ng.addEventListener('click', (e) => {
        e.stopPropagation();
        toggleNode(node.id);
      });
    }

    // Tooltip
    ng.addEventListener('mouseenter', (e) => showTooltip(e, node));
    ng.addEventListener('mouseleave', hideTooltip);

    nodeGroup.appendChild(ng);
  });
}

function hexToRgba(hex, alpha) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${alpha})`;
}

function toggleNode(id) {
  if (collapsed.has(id)) {
    collapsed.delete(id);
  } else {
    collapsed.add(id);
  }
  render();
}

function expandAll() {
  collapsed.clear();
  render();
}

function collapseAll() {
  collapsed.clear();
  // Collapse all level 1 nodes
  data.children.forEach(c => collapsed.add(c.id));
  render();
}

function applyTransform() {
  const g = document.getElementById('scene');
  if (g) g.setAttribute("transform", `translate(${transform.x},${transform.y}) scale(${transform.scale})`);
}

function resetView() {
  transform = { x: 0, y: 0, scale: 1 };
  applyTransform();
}

// ─── TOOLTIP ─────────────────────────────────────────────────────────────────
function showTooltip(e, node) {
  const childCount = node.children ? node.children.length : 0;
  let html = `<strong>${node.label.replace(/\n/g,' ')}</strong>`;
  if (childCount > 0) {
    html += `<span style="color:${node.color || '#8a8fa8'}">${childCount} sub-item${childCount > 1 ? 's' : ''}</span>`;
    if (collapsed.has(node.id)) html += `<br><em style="color:#8a8fa8;font-size:10px">Click to expand</em>`;
    else html += `<br><em style="color:#8a8fa8;font-size:10px">Click to collapse</em>`;
  }
  tooltip.innerHTML = html;
  tooltip.style.left = (e.clientX + 12) + 'px';
  tooltip.style.top = (e.clientY - 8) + 'px';
  tooltip.classList.add('show');
}

function hideTooltip() {
  tooltip.classList.remove('show');
}

// ─── PAN & ZOOM ──────────────────────────────────────────────────────────────
wrap.addEventListener('mousedown', e => {
  if (e.target.closest('.node-group')) return;
  isDragging = true;
  dragStart = { x: e.clientX - transform.x, y: e.clientY - transform.y };
  wrap.classList.add('dragging');
});

window.addEventListener('mousemove', e => {
  if (!isDragging) return;
  transform.x = e.clientX - dragStart.x;
  transform.y = e.clientY - dragStart.y;
  applyTransform();
});

window.addEventListener('mouseup', () => {
  isDragging = false;
  wrap.classList.remove('dragging');
});

wrap.addEventListener('wheel', e => {
  e.preventDefault();
  const delta = e.deltaY > 0 ? 0.92 : 1.09;
  const rect = wrap.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;
  transform.x = mx - (mx - transform.x) * delta;
  transform.y = my - (my - transform.y) * delta;
  transform.scale = Math.max(0.2, Math.min(4, transform.scale * delta));
  applyTransform();
}, { passive: false });

// Touch support
let lastTouchDist = null;
wrap.addEventListener('touchstart', e => {
  if (e.touches.length === 1) {
    isDragging = true;
    dragStart = { x: e.touches[0].clientX - transform.x, y: e.touches[0].clientY - transform.y };
  }
}, { passive: true });

wrap.addEventListener('touchmove', e => {
  if (e.touches.length === 1 && isDragging) {
    transform.x = e.touches[0].clientX - dragStart.x;
    transform.y = e.touches[0].clientY - dragStart.y;
    applyTransform();
  } else if (e.touches.length === 2) {
    const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
    if (lastTouchDist) {
      const delta = d / lastTouchDist;
      transform.scale = Math.max(0.2, Math.min(4, transform.scale * delta));
      applyTransform();
    }
    lastTouchDist = d;
  }
}, { passive: true });

wrap.addEventListener('touchend', () => {
  isDragging = false;
  lastTouchDist = null;
});

// ─── INIT ────────────────────────────────────────────────────────────────────
// Initially collapse some deep nodes for readability
function init() {
  // Collapse leaf-heavy level-2 nodes
  const deepCollapseIds = ["legal","governance","core-policies","operational-policies","income","budgeting","banking-fiscal","programs-services","facilitator-staffing","location-facilities","external-comms","internal-comms","marketing","standing-committees"];
  deepCollapseIds.forEach(id => collapsed.add(id));
  render();

  // Fade out hint after 4s
  setTimeout(() => {
    document.getElementById('hint').style.opacity = '0';
    document.getElementById('hint').style.transition = 'opacity 1s';
  }, 4000);
}

window.addEventListener('resize', () => render());
init();
</script>
